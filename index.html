<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Mario Web</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#5c94fc;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;padding:0;margin:0;gap:0;position:relative}
  #hud{position:absolute;top:10px;display:flex;gap:26px;font-weight:bold;font-size:17px;letter-spacing:1px;text-shadow:0 2px 0 #000;z-index:10}
  canvas{background:#5c94fc;width:100vw;height:100vh;object-fit:fill;image-rendering:pixelated;display:block;margin:0;padding:0;position:absolute;top:0;left:0;}
  .tip{font-size:12px;opacity:.6;text-align:center;position:absolute;bottom:10px;width:100%;z-index:10;}
  #touch{display:none;position:absolute;bottom:20px;width:100%;justify-content:space-between;padding:0 30px;z-index:10;box-sizing:border-box;pointer-events:none;}
  .dpad{display:flex;gap:15px;pointer-events:auto;}
  .action{display:flex;pointer-events:auto;}
  #touch button{width:75px;height:75px;border-radius:50%;border:3px solid rgba(255,255,255,0.4);background:rgba(0,0,0,0.2);color:#fff;font-size:30px;font-weight:bold;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center;}
  body.mobile #touch{display:flex}
  body.mobile .tip{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>🪙 <span id="coins">0</span></span>
    <span>❤️ <span id="lives">3</span></span>
    <span id="lvl">MAPA</span>
  </div>
  <canvas id="cv" width="800" height="480"></canvas>
  <div id="touch">
    <div class="dpad">
      <button id="bL">◀</button>
      <button id="bR">▶</button>
    </div>
    <div class="action">
      <button id="bJ">▲</button>
    </div>
  </div>
  <div class="tip">← → mover &nbsp;•&nbsp; ESPAÇO / ↑ pular &nbsp;•&nbsp; fique em cima de um tubo e aperte ↑ para entrar na fase</div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VW = cv.width, VH = cv.height;
const TS = 40, ROWS = 12;
const GRAV = 2100, MAXFALL = 1500, SPEED = 250, ACCEL = 2600, FRICTION = 2600, JUMP = -950;

const elCoins = document.getElementById('coins');
const elLives = document.getElementById('lives');
const elLvl = document.getElementById('lvl');

const keys = {};
const just = {};

window.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  if (!keys[e.code]) just[e.code] = true;
  keys[e.code] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

function bindBtn(id, code) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); if (!keys[code]) just[code] = true; keys[code] = true; };
  const up = e => { e.preventDefault(); keys[code] = false; };
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up);
  el.addEventListener('touchcancel', up);
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
}
bindBtn('bL', 'ArrowLeft');
bindBtn('bR', 'ArrowRight');
bindBtn('bJ', 'Space');

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.matchMedia("(pointer: coarse)").matches;
if (isMobile) document.body.classList.add('mobile');

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.08);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'stomp') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'block') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(987, now);
        osc.frequency.setValueAtTime(1318, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'death') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.5);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
    }
}

document.addEventListener('pointerdown', () => {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
});

function spawnSmoke(x, y) {
    if (!level) return;
    for (let i = 0; i < 6; i++) {
        level.particles.push({
            x: x + (Math.random() - 0.5) * 20,
            y: y + (Math.random() - 0.5) * 10,
            vx: (Math.random() - 0.5) * 100,
            vy: -Math.random() * 50 - 20,
            life: 0.5,
            maxLife: 0.5,
            isSmoke: true,
            size: Math.random() * 6 + 4
        });
    }
}

// removido, agora usa playSound('block')

const LEVELS = [
  {
    name: '1-1', width: 100, start: 3, flag: 95,
    ground: [[0,30],[34,64],[68,100]],
    bricks: [{x:20,y:6,w:3},{x:48,y:7,w:5}],
    qblocks: [{x:23,y:6,w:1},{x:25,y:6,w:1},{x:54,y:7,w:1}],
    coins: [{x:12,y:7,w:3},{x:20,y:5,w:3},{x:38,y:8,w:4},{x:49,y:5,w:3},{x:76,y:7,w:4}],
    goombas: [16,27,40,50,58,72,82,90]
  },
  {
    name: '1-2', width: 110, start: 3, flag: 105,
    ground: [[0,20],[24,40],[44,60],[64,84],[88,110]],
    bricks: [{x:14,y:6,w:3},{x:30,y:7,w:4},{x:48,y:6,w:3},{x:70,y:7,w:5},{x:92,y:6,w:4}],
    qblocks: [{x:17,y:6,w:1},{x:54,y:7,w:1},{x:76,y:7,w:1}],
    coins: [{x:8,y:7,w:3},{x:14,y:5,w:3},{x:30,y:6,w:4},{x:48,y:5,w:3},{x:70,y:6,w:5},{x:92,y:5,w:4},{x:100,y:8,w:3}],
    goombas: [10,16,28,36,50,58,68,74,90,98]
  },
  {
    name: '1-3', width: 120, start: 3, flag: 115,
    ground: [[0,14],[18,28],[32,42],[46,56],[60,72],[76,90],[94,120]],
    bricks: [{x:6,y:6,w:2},{x:20,y:5,w:3},{x:34,y:7,w:3},{x:50,y:6,w:3},{x:62,y:7,w:4},{x:80,y:5,w:3},{x:98,y:6,w:3}],
    qblocks: [{x:8,y:6,w:1},{x:22,y:5,w:1},{x:64,y:7,w:1},{x:82,y:5,w:1}],
    coins: [{x:6,y:5,w:2},{x:20,y:4,w:3},{x:34,y:6,w:3},{x:50,y:5,w:3},{x:62,y:6,w:4},{x:80,y:4,w:3},{x:98,y:5,w:3},{x:110,y:8,w:4}],
    goombas: [8,12,22,26,38,50,64,70,82,88,100,108]
  }
];

let state = 'overworld';
let lives = 3;
let coinsTotal = 0;
let level = null;
let player = null;
let T = 0;
let toastMsg = '';
let toastTime = 0;
const completed = [false, false, false];

const ow = {
  width: 2100,
  camX: 0,
  near: null,
  mario: { x: 130, y: 338, w: 30, h: 42, vx: 0, facing: 1, phase: 0 },
  nodes: [
    { x: 430, level: 0, label: '1-1' },
    { x: 1050, level: 1, label: '1-2' },
    { x: 1680, level: 2, label: '1-3' }
  ],
  clouds: [
    { x: 120, y: 70, s: 1 }, { x: 460, y: 120, s: 0.8 }, { x: 760, y: 55, s: 1.2 },
    { x: 1180, y: 100, s: 0.9 }, { x: 1560, y: 65, s: 1.1 }, { x: 1900, y: 130, s: 0.85 }
  ],
  hills: [
    { x: 200, s: 1 }, { x: 700, s: 0.75 }, { x: 1150, s: 1.15 }, { x: 1600, s: 0.9 }, { x: 1980, s: 1 }
  ]
};

function buildGrid(spec) {
  const g = [];
  for (let y = 0; y < ROWS; y++) g.push(new Array(spec.width).fill(' '));
  const set = (x, y, c) => { if (x >= 0 && x < spec.width && y >= 0 && y < ROWS) g[y][x] = c; };
  (spec.ground || []).forEach(r => { for (let x = r[0]; x < r[1]; x++) { set(x, 10, '#'); set(x, 11, '#'); } });
  (spec.bricks || []).forEach(b => { for (let i = 0; i < (b.w || 1); i++) set(b.x + i, b.y, 'B'); });
  (spec.qblocks || []).forEach(b => { for (let i = 0; i < (b.w || 1); i++) set(b.x + i, b.y, '?'); });
  (spec.coins || []).forEach(c => { for (let i = 0; i < (c.w || 1); i++) set(c.x + i, c.y, 'o'); });
  return g;
}

function spawnTop(grid, tx) {
  for (let y = 0; y < ROWS; y++) {
    const c = grid[y][tx];
    if (c === '#' || c === 'B' || c === '?' || c === 'X') return y * TS;
  }
  return ROWS * TS;
}

function solidAt(tx, ty) {
  if (!level) return false;
  if (tx < 0 || tx >= level.width) return true;
  if (ty < 0 || ty >= ROWS) return false;
  const c = level.grid[ty][tx];
  return c === '#' || c === 'B' || c === '?' || c === 'X';
}

function loadLevel(i) {
  const spec = LEVELS[i];
  const grid = buildGrid(spec);
  level = {
    index: i, spec: spec, grid: grid, width: spec.width,
    enemies: [], particles: [], camX: 0,
    flagX: spec.flag, done: false
  };
  spec.goombas.forEach(tx => {
    const top = spawnTop(grid, tx);
    level.enemies.push({ x: tx * TS + 4, y: top - 32, w: 32, h: 32, vx: -70, vy: 0, alive: true, onGround: false });
  });
  player = {
    x: spec.start * TS + 6, y: spawnTop(grid, spec.start) - 38,
    w: 28, h: 38, vx: 0, vy: 0, onGround: false, facing: 1, jumpLock: false, phase: 0, state: 'idle'
  };
  state = 'level';
  elLvl.textContent = spec.name;
}

function addCoin() {
  coinsTotal++;
  elCoins.textContent = coinsTotal;
  playSound('coin');
}

function toast(msg) {
  toastMsg = msg;
  toastTime = 2.2;
}

function die() {
  if (player.dead) return;
  player.dead = true;
  player.state = 'dead';
  player.vy = -950;
  player.vx = 0;
  lives--;
  elLives.textContent = lives;
  playSound('death');
}

function dieVoid() {
  if (player.dead) return;
  player.dead = true;
  player.state = 'void_dead';
  player.y = VH; 
  player.vy = -1150; 
  player.vx = 0;
  lives--;
  elLives.textContent = lives;
  playSound('death');
}

function completeLevel() {
  completed[level.index] = true;
  level = null;
  elLvl.textContent = 'MAPA';
  if (completed.every(Boolean)) {
    state = 'win';
  } else {
    state = 'overworld';
    toast('FASE COMPLETA!');
  }
}

function collideX(p) {
  const y0 = Math.floor(p.y / TS), y1 = Math.floor((p.y + p.h - 1) / TS);
  if (p.vx > 0) {
    const tx = Math.floor((p.x + p.w - 1) / TS);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { p.x = tx * TS - p.w; p.vx = 0; break; }
  } else if (p.vx < 0) {
    const tx = Math.floor(p.x / TS);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { p.x = (tx + 1) * TS; p.vx = 0; break; }
  }
}

function collideY(p) {
  p.onGround = false;
  const x0 = Math.floor(p.x / TS), x1 = Math.floor((p.x + p.w - 1) / TS);
  if (p.vy > 0) {
    const ty = Math.floor((p.y + p.h - 1) / TS);
    for (let tx = x0; tx <= x1; tx++) {
      if (solidAt(tx, ty)) { 
        if (p.vy > 400) spawnSmoke(p.x + p.w / 2, p.y + p.h);
        p.y = ty * TS - p.h; 
        p.vy = 0; 
        p.onGround = true; 
        break; 
      }
    }
  } else if (p.vy < 0) {
    const ty = Math.floor(p.y / TS);
    for (let tx = x0; tx <= x1; tx++) {
      if (solidAt(tx, ty)) {
        p.y = (ty + 1) * TS;
        p.vy = 0;
        if (level.grid[ty][tx] === '?') {
          level.grid[ty][tx] = 'X';
          addCoin();
          playSound('block');
          level.particles.push({ x: tx * TS + TS / 2, y: ty * TS, vy: -180, life: 0.8, txt: '+1' });
        }
        break;
      }
    }
  }
}

function updateLevel(dt) {
  const p = player;

  if (p.dead) {
    if (p.state === 'dead') {
        p.vy += GRAV * dt;
        p.y += p.vy * dt;
    } else if (p.state === 'void_dead') {
        p.vy += GRAV * dt;
        p.y += p.vy * dt;
    }
    if (p.y > VH + 200) {
      p.dead = false;
      if (lives <= 0) {
        lives = 3;
        elLives.textContent = lives;
        level = null;
        state = 'overworld';
        elLvl.textContent = 'MAPA';
        toast('SUAS VIDAS ACABARAM!');
      } else {
        loadLevel(level.index);
        toast('CUIDADO!');
      }
    }
    return;
  }

  if (p.y > VH + 200) { dieVoid(); return; }

  const left = keys['ArrowLeft'] || keys['KeyA'];
  const right = keys['ArrowRight'] || keys['KeyD'];
  const jump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];

  if (left && !right) { p.vx -= ACCEL * dt; p.facing = -1; }
  else if (right && !left) { p.vx += ACCEL * dt; p.facing = 1; }
  else {
    if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION * dt);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + FRICTION * dt);
  }
  p.vx = Math.max(-SPEED, Math.min(SPEED, p.vx));

  if (jump && p.onGround && !p.jumpLock) {
    p.vy = JUMP;
    p.onGround = false;
    p.jumpLock = true;
    playSound('jump');
    spawnSmoke(p.x + p.w / 2, p.y + p.h);
  }
  if (!jump) p.jumpLock = false;

  p.vy += GRAV * dt * ((!jump && p.vy < 0) ? 2.1 : 1);
  if (p.vy > MAXFALL) p.vy = MAXFALL;

  p.x += p.vx * dt;
  collideX(p);
  p.y += p.vy * dt;
  collideY(p);

  if (p.onGround) {
    p.state = Math.abs(p.vx) > 20 ? 'run' : 'idle';
    if (Math.abs(p.vx) > 20) p.phase += dt * 14;
  } else {
    p.state = p.vy < 0 ? 'jump' : 'fall';
  }

  const x0 = Math.floor(p.x / TS), x1 = Math.floor((p.x + p.w - 1) / TS);
  const y0 = Math.floor(p.y / TS), y1 = Math.floor((p.y + p.h - 1) / TS);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (tx >= 0 && tx < level.width && ty >= 0 && ty < ROWS && level.grid[ty][tx] === 'o') {
        level.grid[ty][tx] = ' ';
        addCoin();
        level.particles.push({ x: tx * TS + TS / 2, y: ty * TS + 10, vy: -120, life: 0.7, txt: '+1' });
      }
    }
  }

  for (const e of level.enemies) {
    if (!e.alive) continue;
    e.vy += GRAV * dt;
    if (e.vy > MAXFALL) e.vy = MAXFALL;

    e.x += e.vx * dt;
    const dirTx = Math.floor((e.vx > 0 ? e.x + e.w - 1 : e.x) / TS);
    const ety0 = Math.floor(e.y / TS), ety1 = Math.floor((e.y + e.h - 1) / TS);
    let hitWall = false;
    for (let ty = ety0; ty <= ety1; ty++) if (solidAt(dirTx, ty)) hitWall = true;
    if (hitWall) {
      e.x = e.vx > 0 ? dirTx * TS - e.w : (dirTx + 1) * TS;
      e.vx *= -1;
    }

    e.y += e.vy * dt;
    e.onGround = false;
    const ebx0 = Math.floor(e.x / TS), ebx1 = Math.floor((e.x + e.w - 1) / TS);
    if (e.vy > 0) {
      const by = Math.floor((e.y + e.h - 1) / TS);
      for (let bx = ebx0; bx <= ebx1; bx++) {
        if (solidAt(bx, by)) { e.y = by * TS - e.h; e.vy = 0; e.onGround = true; break; }
      }
    }

    if (e.onGround) {
      const footX = e.vx > 0 ? Math.floor((e.x + e.w + 2) / TS) : Math.floor((e.x - 2) / TS);
      const footY = Math.floor((e.y + e.h + 4) / TS);
      if (!solidAt(footX, footY)) e.vx *= -1;
    }

    if (e.y > VH + 300) { e.alive = false; continue; }

    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
      if (p.vy > 0 && p.y + p.h < e.y + e.h * 0.75) {
        e.alive = false;
        p.vy = JUMP * 0.55;
        playSound('stomp');
        level.particles.push({ x: e.x + e.w / 2, y: e.y, vy: -150, life: 0.6, txt: 'POW' });
      } else {
        die();
        return;
      }
    }
  }

  for (let i = level.particles.length - 1; i >= 0; i--) {
    const q = level.particles[i];
    q.y += q.vy * dt;
    if (q.isSmoke) {
      q.x += q.vx * dt;
      q.size += 20 * dt;
    } else {
      q.vy += 260 * dt;
    }
    q.life -= dt;
    if (q.life <= 0) level.particles.splice(i, 1);
  }

  level.camX = Math.max(0, Math.min(level.width * TS - VW, p.x + p.w / 2 - VW / 2));

  if (p.x + p.w > level.flagX * TS + 10) completeLevel();
}

function updateOverworld(dt) {
  const m = ow.mario;
  const left = keys['ArrowLeft'] || keys['KeyA'];
  const right = keys['ArrowRight'] || keys['KeyD'];
  if (left && !right) { m.vx = -270; m.facing = -1; }
  else if (right && !left) { m.vx = 270; m.facing = 1; }
  else m.vx = 0;
  m.x += m.vx * dt;
  m.x = Math.max(50, Math.min(ow.width - 70, m.x));
  if (m.vx !== 0) m.phase += dt * 13;

  ow.near = null;
  for (const n of ow.nodes) if (Math.abs(m.x - n.x) < 62) ow.near = n;

  if (ow.near && (just['ArrowUp'] || just['Space'] || just['Enter'] || just['KeyW'])) {
    loadLevel(ow.near.level);
    return;
  }

  ow.camX = Math.max(0, Math.min(ow.width - VW, m.x - VW / 2));
}

function drawTile(c, px, py) {
  if (c === '#') {
    ctx.fillStyle = '#c1662f';
    ctx.fillRect(px, py, TS, TS);
    ctx.fillStyle = '#e08a4a';
    ctx.fillRect(px + 2, py + 2, TS - 4, TS - 8);
    ctx.fillStyle = '#8d3f13';
    ctx.fillRect(px, py + TS - 5, TS, 5);
    ctx.fillRect(px, py, 4, TS);
    ctx.fillRect(px + TS - 4, py, 4, TS);
    ctx.fillStyle = '#a8541f';
    ctx.fillRect(px + TS / 2 - 2, py + 6, 4, TS - 16);
  } else if (c === 'B') {
    ctx.fillStyle = '#a0522d';
    ctx.fillRect(px, py, TS, TS);
    ctx.fillStyle = '#d2691e';
    ctx.fillRect(px + 2, py + 2, TS - 4, TS / 2 - 4);
    ctx.fillRect(px + 2, py + TS / 2 + 2, TS - 4, TS / 2 - 4);
    ctx.fillStyle = '#5c2c0d';
    ctx.fillRect(px, py + TS / 2 - 2, TS, 4);
    ctx.fillRect(px + TS / 2 - 2, py, 4, TS / 2 - 2);
    ctx.fillRect(px, py + TS / 2 + 2, 4, TS / 2 - 2);
    ctx.fillRect(px + TS - 4, py + TS / 2 + 2, 4, TS / 2 - 2);
  } else if (c === '?') {
    const bob = Math.sin(T * 4 + px) * 2;
    ctx.fillStyle = '#8a5a00';
    ctx.fillRect(px, py, TS, TS);
    ctx.fillStyle = '#f7b731';
    ctx.fillRect(px + 2, py + 2, TS - 4, TS - 4);
    ctx.fillStyle = '#ffe28a';
    ctx.fillRect(px + 4, py + 4, TS - 8, 6);
    ctx.fillStyle = '#8a5a00';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('?', px + TS / 2, py + TS / 2 + 9 + bob * 0.2);
  } else if (c === 'X') {
    ctx.fillStyle = '#6b4423';
    ctx.fillRect(px, py, TS, TS);
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(px + 3, py + 3, TS - 6, TS - 6);
    ctx.fillStyle = '#5c3616';
    ctx.fillRect(px + 8, py + 8, TS - 16, TS - 16);
  } else if (c === 'o') {
    const bob = Math.sin(T * 5 + px * 0.1) * 3;
    const cx = px + TS / 2, cy = py + TS / 2 + bob;
    ctx.fillStyle = '#c98a00';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 9, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 7, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff6b0';
    ctx.fillRect(cx - 3, cy - 5, 2, 7);
  }
}

function drawMario(px, py, w, h, facing, phase, onGround, moving, state) {
  ctx.save();
  ctx.translate(px + w / 2, py);
  if (facing < 0) ctx.scale(-1, 1);
  const x = -w / 2;

  const isDead = state === 'dead';
  const isVoid = state === 'void_dead';
  const isJump = state === 'jump';
  const isFall = state === 'fall';

  ctx.fillStyle = '#e52521';
  ctx.fillRect(x + w * 0.08, 0, w * 0.84, h * 0.19);
  ctx.fillRect(x + w * 0.42, h * 0.17, w * 0.62, h * 0.07);

  ctx.fillStyle = '#f7c59f';
  ctx.fillRect(x + w * 0.12, h * 0.22, w * 0.76, h * 0.22);

  if (isDead || isVoid) {
    ctx.fillStyle = '#1b1b2f';
    ctx.fillRect(x + w * 0.2, h * 0.27, w * 0.15, h * 0.06);
    ctx.fillRect(x + w * 0.65, h * 0.27, w * 0.15, h * 0.06);
  } else {
    ctx.fillStyle = '#1b1b2f';
    ctx.fillRect(x + w * 0.52, h * 0.27, w * 0.11, h * 0.1);
  }

  ctx.fillStyle = '#5a2d0c';
  ctx.fillRect(x + w * 0.38, h * 0.36, w * 0.54, h * 0.08);

  ctx.fillStyle = '#e52521';
  if (isJump || isDead) {
    ctx.fillRect(x, h * 0.25, w * 0.18, h * 0.24);
    ctx.fillRect(x + w * 0.82, h * 0.25, w * 0.18, h * 0.24);
  } else if (isFall) {
    ctx.fillRect(x - w * 0.05, h * 0.45, w * 0.18, h * 0.24);
    ctx.fillRect(x + w * 0.87, h * 0.45, w * 0.18, h * 0.24);
  } else {
    ctx.fillRect(x, h * 0.45, w * 0.18, h * 0.24);
    ctx.fillRect(x + w * 0.82, h * 0.45, w * 0.18, h * 0.24);
  }

  ctx.fillStyle = '#2a6df4';
  ctx.fillRect(x + w * 0.14, h * 0.46, w * 0.72, h * 0.32);
  ctx.fillStyle = '#ffd93b';
  ctx.fillRect(x + w * 0.3, h * 0.55, w * 0.1, h * 0.08);
  ctx.fillRect(x + w * 0.6, h * 0.55, w * 0.1, h * 0.08);

  ctx.fillStyle = '#6b3410';
  if (state === 'run') {
    const swing = Math.sin(phase) * w * 0.14;
    ctx.fillRect(x + w * 0.04 + swing, h * 0.78, w * 0.42, h * 0.22);
    ctx.fillRect(x + w * 0.54 - swing, h * 0.78, w * 0.42, h * 0.22);
  } else if (isJump) {
    ctx.fillRect(x + w * 0.04, h * 0.78, w * 0.35, h * 0.15);
    ctx.fillRect(x + w * 0.6, h * 0.78, w * 0.35, h * 0.15);
    ctx.fillRect(x + w * 0.04, h * 0.85, w * 0.42, h * 0.15);
    ctx.fillRect(x + w * 0.54, h * 0.85, w * 0.42, h * 0.15);
  } else if (isFall) {
    ctx.fillRect(x + w * 0.04, h * 0.78, w * 0.42, h * 0.22);
    ctx.fillRect(x + w * 0.54, h * 0.78, w * 0.42, h * 0.22);
  } else if (isDead) {
    ctx.fillRect(x + w * 0.04, h * 0.78, w * 0.42, h * 0.22);
    ctx.fillRect(x + w * 0.54, h * 0.78, w * 0.42, h * 0.22);
  } else {
    ctx.fillRect(x + w * 0.04, h * 0.78, w * 0.42, h * 0.22);
    ctx.fillRect(x + w * 0.54, h * 0.78, w * 0.42, h * 0.22);
  }

  ctx.restore();
}

function drawGoomba(e, camX) {
  const x = e.x - camX, y = e.y, w = e.w, h = e.h;
  ctx.fillStyle = '#8b4513';
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + h * 0.48, w * 0.5, h * 0.46, 0, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x, y + h * 0.46, w, h * 0.36);
  ctx.fillStyle = '#3b1f0b';
  ctx.fillRect(x + w * 0.02, y + h * 0.8, w * 0.4, h * 0.2);
  ctx.fillRect(x + w * 0.58, y + h * 0.8, w * 0.4, h * 0.2);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + w * 0.2, y + h * 0.34, w * 0.2, h * 0.22);
  ctx.fillRect(x + w * 0.6, y + h * 0.34, w * 0.2, h * 0.22);
  ctx.fillStyle = '#000';
  const look = e.vx > 0 ? 0.05 : 0;
  ctx.fillRect(x + w * 0.26 + w * look, y + h * 0.4, w * 0.09, h * 0.14);
  ctx.fillRect(x + w * 0.66 + w * look, y + h * 0.4, w * 0.09, h * 0.14);
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.arc(x, y, 26 * s, 0, Math.PI * 2);
  ctx.arc(x + 30 * s, y - 12 * s, 32 * s, 0, Math.PI * 2);
  ctx.arc(x + 66 * s, y, 24 * s, 0, Math.PI * 2);
  ctx.rect(x, y - 6 * s, 66 * s, 28 * s);
  ctx.fill();
}

function drawHill(x, s) {
  ctx.fillStyle = '#2fa84f';
  ctx.beginPath();
  ctx.arc(x, 380, 100 * s, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#37c25c';
  ctx.beginPath();
  ctx.arc(x - 22 * s, 380, 62 * s, Math.PI, 0);
  ctx.fill();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#4a86f7');
  g.addColorStop(0.65, '#87c1ff');
  g.addColorStop(1, '#bfe3ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
}

function drawLevel() {
  drawSky();

  const camX = level.camX;

  for (const c of ow.clouds) {
    const cx = c.x - camX * 0.25;
    if (cx > -160 && cx < VW + 160) drawCloud(((cx % 2400) + 2400) % 2400 - 200, c.y, c.s * 0.85);
  }
  for (const h of ow.hills) {
    const hx = h.x - camX * 0.45;
    if (hx > -220 && hx < VW + 220) drawHill(((hx % 2400) + 2400) % 2400 - 200, h.s);
  }

  const t0 = Math.floor(camX / TS) - 1;
  const t1 = Math.ceil((camX + VW) / TS) + 1;
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = t0; tx <= t1; tx++) {
      if (tx < 0 || tx >= level.width) continue;
      const c = level.grid[ty][tx];
      if (c !== ' ') drawTile(c, tx * TS - camX, ty * TS);
    }
  }

  const fx = level.flagX * TS - camX;
  ctx.fillStyle = '#d0d0d0';
  ctx.fillRect(fx, 120, 6, 280);
  ctx.fillStyle = '#ffd93b';
  ctx.beginPath();
  ctx.arc(fx + 3, 118, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e52521';
  ctx.beginPath();
  ctx.moveTo(fx + 6, 130);
  ctx.lineTo(fx + 62 + Math.sin(T * 4) * 5, 150);
  ctx.lineTo(fx + 6, 170);
  ctx.closePath();
  ctx.fill();

  for (const e of level.enemies) {
    if (!e.alive) continue;
    if (e.x - camX < -80 || e.x - camX > VW + 80) continue;
    drawGoomba(e, camX);
  }

  drawMario(player.x - camX, player.y, player.w, player.h, player.facing, player.phase, player.onGround, Math.abs(player.vx) > 20, player.state);

  for (const q of level.particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life * 2));
    if (q.isSmoke) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(q.x - camX, q.y, q.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(q.txt, q.x - camX, q.y);
    }
    ctx.globalAlpha = 1;
  }

  const pct = Math.min(1, player.x / (level.flagX * TS));
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(VW - 190, 16, 170, 16);
  ctx.fillStyle = '#ffd93b';
  ctx.fillRect(VW - 187, 19, 164 * pct, 10);
}

function drawPipe(x, y, w, h) {
  ctx.fillStyle = '#0a8f0a';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#22c522';
  ctx.fillRect(x + 5, y + 16, w * 0.26, h - 16);
  ctx.fillStyle = '#046b04';
  ctx.fillRect(x + w * 0.74, y + 16, w * 0.26, h - 16);
  ctx.fillStyle = '#22c522';
  ctx.fillRect(x - 8, y, w + 16, 20);
  ctx.fillStyle = '#0a8f0a';
  ctx.fillRect(x - 8, y + 14, w + 16, 8);
  ctx.strokeStyle = '#023d02';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 8, y, w + 16, 20);
  ctx.strokeRect(x, y + 16, w, h - 16);
}

function drawOverworld() {
  drawSky();

  for (const c of ow.clouds) {
    const cx = c.x - ow.camX * 0.4;
    if (cx > -180 && cx < VW + 180) drawCloud(cx, c.y, c.s);
  }

  ctx.fillStyle = '#8fd6ff';
  for (let i = 0; i < 14; i++) {
    const hx = i * 180 - ow.camX * 0.55;
    const hxw = ((hx % 2520) + 2520) % 2520 - 200;
    if (hxw > -220 && hxw < VW + 220) drawHill(hxw, 0.6 + (i % 3) * 0.2);
  }

  ctx.fillStyle = '#2fa84f';
  ctx.fillRect(0, 380, VW, 20);
  ctx.fillStyle = '#7a4a1e';
  ctx.fillRect(0, 400, VW, VH - 400);
  ctx.fillStyle = '#94591f';
  for (let x = -((ow.camX * 0.8) % 60); x < VW; x += 60) {
    ctx.fillRect(x, 405, 28, 6);
    ctx.fillRect(x + 30, 425, 28, 6);
  }

  for (const n of ow.nodes) {
    const sx = n.x - ow.camX;
    if (sx < -140 || sx > VW + 140) continue;

    drawPipe(sx - 34, 296, 68, 84);

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(sx - 46, 246, 92, 30);
    ctx.strokeStyle = completed[n.level] ? '#7dff7d' : '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - 46, 246, 92, 30);
    ctx.fillStyle = completed[n.level] ? '#7dff7d' : '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(completed[n.level] ? '✔ ' + n.label : n.label, sx, 268);
  }

  const m = ow.mario;
  drawMario(m.x - ow.camX, m.y, m.w, m.h, m.facing, m.phase, true, m.vx !== 0, m.vx !== 0 ? 'run' : 'idle');

  if (ow.near) {
    const bob = Math.sin(T * 6) * 5;
    const sx = ow.near.x - ow.camX;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(sx - 105, 196 + bob, 210, 34);
    ctx.strokeStyle = '#ffd93b';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - 105, 196 + bob, 210, 34);
    ctx.fillStyle = '#ffd93b';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('APERTE ↑ PARA ENTRAR', sx, 219 + bob);
  }

  const total = completed.filter(Boolean).length;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(16, 16, 168, 34);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('FASES: ' + total + ' / 3', 30, 39);
}

function drawWin() {
  drawSky();
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd93b';
  ctx.font = 'bold 56px Arial';
  ctx.fillText('VOCÊ ZEROU!', VW / 2, 190);
  ctx.font = 'bold 90px Arial';
  ctx.fillText('🏆', VW / 2, 290);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('Moedas: ' + coinsTotal, VW / 2, 350);
  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = Math.sin(T * 5) > 0 ? '#fff' : '#ffd93b';
  ctx.fillText('Aperte ESPAÇO para jogar de novo', VW / 2, 410);
}

function drawToast() {
  if (toastTime <= 0) return;
  ctx.globalAlpha = Math.min(1, toastTime);
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(VW / 2 - 170, 74, 340, 46);
  ctx.strokeStyle = '#ffd93b';
  ctx.lineWidth = 2;
  ctx.strokeRect(VW / 2 - 170, 74, 340, 46);
  ctx.fillStyle = '#ffd93b';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(toastMsg, VW / 2, 104);
  ctx.globalAlpha = 1;
}

function resetGame() {
  completed.fill(false);
  lives = 3;
  coinsTotal = 0;
  level = null;
  player = null;
  ow.mario.x = 130;
  ow.mario.vx = 0;
  elLives.textContent = lives;
  elCoins.textContent = coinsTotal;
  elLvl.textContent = 'MAPA';
  state = 'overworld';
}

function update(dt) {
  T += dt;
  if (toastTime > 0) toastTime -= dt;

  if (state === 'overworld') updateOverworld(dt);
  else if (state === 'level') updateLevel(dt);
  else if (state === 'win') {
    if (just['Space'] || just['Enter']) resetGame();
  }
}

function draw() {
  ctx.clearRect(0, 0, VW, VH);
  if (state === 'overworld') drawOverworld();
  else if (state === 'level') drawLevel();
  else if (state === 'win') drawWin();
  drawToast();
}

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
  for (const k in just) delete just[k];
  requestAnimationFrame(loop);
}

elLives.textContent = lives;
elCoins.textContent = coinsTotal;
requestAnimationFrame(loop);
</script>
